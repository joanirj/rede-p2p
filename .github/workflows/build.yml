name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Instalar gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Compilar o tun2socks (Go → AAR)
        working-directory: tun2socks-bridge
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "NDK: $ANDROID_NDK_HOME"
          go mod tidy
          go get golang.org/x/mobile/bind@latest
          gomobile init
          mkdir -p ../app/libs
          gomobile bind -v -target=android/arm64,android/arm -androidapi 21 -o ../app/libs/tun2socks.aar .

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar o app
        run: gradle :app:assembleDebug --stacktrace

      - name: Publicar o APK em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk rede-p2p.apk
          gh release create "teste-${{ github.run_number }}" rede-p2p.apk \
            --title "Teste ${{ github.run_number }}" \
            --notes "Versão de teste gerada automaticamente a partir do commit ${{ github.sha }}." \
            --latest
